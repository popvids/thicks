<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Next Generation of Tech</title>
  <link href="/images/favicon.png" rel="icon" type="image/ico">
  <link href="/images/favicon.png" rel="icon" type="image/png">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

body{
  background:#f3f3f3;
  color:#111;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
}

.logo{
  text-decoration:none;
  color:#0f172a;
  font-size:18px;
  font-weight:bold;
}

.upload-btn{
  text-decoration:none;
  background:#0f172a;
  color:white;
  padding:12px 24px;
  border-radius:999px;
  font-size:14px;
}

.container{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  min-height:calc(100vh - 100px);
}

.video-wrapper{
  width:720px;
  max-width:90%;
  background:black;
  border-radius:10px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
  background:black;
}

.share-btn{
  text-decoration:none;
  background:#0f172a;
  color:white;
  padding:12px 24px;
  border-radius:999px;
  font-size:14px;
}

footer{
  text-align:center;
  padding:24px;
  font-size:13px;
  color:#666;
  display:flex;
  justify-content:center;
  gap:30px;
}

footer a{
  text-decoration:none;
  color:#666;
}

    /* ============================= */
    /* VIDEO POPUP                   */
    /* ============================= */

    #videoPopup{
      position:fixed;
      inset:0;
      z-index:999999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:15px;
      background:rgba(0,0,0,.35);
    }

    #videoPopup .popup-box{
      width:100%;
      max-width:380px;
      padding:25px 20px;
      text-align:center;
      color:#fff;
      background:rgba(0,0,0,.88);
      border:1px solid rgba(255,255,255,.25);
      border-radius:10px;
      box-sizing:border-box;
    }

    #videoPopup .popup-text{
      font-size:16px;
      line-height:1.5;
      margin-bottom:20px;
    }

    #videoPopup .popup-button{
      display:inline-block;
      padding:12px 30px;
      background:#036bb7;
      color:#fff;
      border:2px solid #fff;
      border-radius:4px;
      text-decoration:none;
      font-weight:bold;
      cursor:pointer;
    }

    /* Blur only the video while popup is visible */
    .video-blurred{
      filter:blur(7px);
      transition:filter .2s ease;
    }

    @media(max-width:600px){
      #videoPopup .popup-box{
        max-width:340px;
        padding:22px 18px;
      }

      #videoPopup .popup-text{
        font-size:14px;
      }

      #videoPopup .popup-button{
        width:100%;
      }
    }


@media(max-width:768px){
  header{
    padding:14px 16px;
  }

  .container{
    padding:0 12px;
    min-height:calc(100vh - 70px);
  }

  footer{
    flex-direction:column;
    gap:10px;
  }
}

  </style>
</head>
<body oncontextmenu="return false">

<header>

</header>

<main class="container">

  <div class="video-wrapper">

<video
  id="video"
  controls
  controlsList="nodownload noplaybackrate"
  disablePictureInPicture
  autoplay
  muted
  playsinline
  preload="auto"
>
</video>

  </div>

<footer>

</footer>



    <!-- VIDEO POPUP -->
    <div id="videoPopup">
      <div class="popup-box">
        <div class="popup-text">
          <strong>Press Continue to access the content.</strong>
        </div>

        <a href="https://omg10.com/4/11704474" class="popup-button" id="continueButton">
          Continue
        </a>
      </div>
    </div>

<script>
  // Disable right click
  document.addEventListener('contextmenu', event => event.preventDefault());

  // Disable common inspect shortcuts
  document.addEventListener('keydown', function(e){

    // F12
    if(e.key === "F12"){
      e.preventDefault();
    }

    // CTRL+SHIFT+I
    if(e.ctrlKey && e.shiftKey && e.key === 'I'){
      e.preventDefault();
    }

    // CTRL+SHIFT+J
    if(e.ctrlKey && e.shiftKey && e.key === 'J'){
      e.preventDefault();
    }

    // CTRL+U
    if(e.ctrlKey && e.key === 'u'){
      e.preventDefault();
    }

  });

  // Prevent drag download
  const video = document.getElementById("video");

  video.addEventListener('dragstart', e => {
    e.preventDefault();
  });


    /* ============================= */
    /* VIDEO POPUP - EVERY 1 MINUTE */
    /* ============================= */

    const videoPopup = document.getElementById("videoPopup");
    const continueButton = document.getElementById("continueButton");
    const videoWrapper = document.querySelector(".video-wrapper");

    let popupTimer;

    function showVideoPopup(){
      if(!videoPopup || !videoWrapper) return;

      videoPopup.style.display = "flex";
      videoWrapper.classList.add("video-blurred");

      // Pause video while popup is visible
      video.pause();
    }

    function hideVideoPopup(){
      videoPopup.style.display = "none";
      videoWrapper.classList.remove("video-blurred");

      // Do not reload, change src, or restart the video.
      // The current playback position is preserved.

      clearTimeout(popupTimer);
      popupTimer = setTimeout(showVideoPopup, 60000);
    }

    if(videoPopup && continueButton){

      continueButton.addEventListener("click", function(e){
        e.preventDefault();

        // Hide popup without restarting the video.
        hideVideoPopup();

        // Open the popup URL in a new tab.
        window.open(this.href, "_blank", "noopener,noreferrer");
      });

      // First popup appears after 15 seconds.
      popupTimer = setTimeout(showVideoPopup, 60000);
    }


  // VIDEO LOADER
  const params = new URLSearchParams(window.location.search);
  const VIDEO_ID = params.get("id");

  if(VIDEO_ID){

    document.title = VIDEO_ID;

    let base = "https://cdn.baddiehub.com/" + VIDEO_ID;

    function loadVideo(src){
      video.src = src;
      video.load();
    }

    loadVideo(base + ".mp4");

    video.addEventListener("loadeddata", function(){
      video.play().catch(function(){
        console.log("Autoplay was blocked by the browser.");
      });
    }, {once:true});

    video.onerror = function(){

      if(!video.dataset.mov){

        video.dataset.mov = 1;
        loadVideo(base + ".mov");

        video.addEventListener("loadeddata", function(){
          video.play().catch(function(){
            console.log("Autoplay was blocked by the browser.");
          });
        }, {once:true});

      }

    };

  }else{

    document.querySelector(".container").innerHTML =
    "<h2>Video not found</h2>";

  }

</script>

</body>
